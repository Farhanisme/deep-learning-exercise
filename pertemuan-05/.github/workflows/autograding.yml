name: Autograding
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cek file wajib
        run: |
          test -f README.md
          test -f SUBMISSION.md
          test -f src/digit.py
          test -f notebooks/eksplorasi.ipynb
      - name: Cek placeholder NIM
        run: |
          if grep -q "YOUR_NIM" SUBMISSION.md; then
            echo "::error::SUBMISSION.md masih ada YOUR_NIM"
            exit 1
          fi
      - name: Cek sintaks Python
        run: python -m py_compile src/*.py
      - name: Jalankan pytest
        run: |
          pip install -q -r requirements.txt
          pytest -q
